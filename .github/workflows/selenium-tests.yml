name: Selenium Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Run Selenium TestNG Suite
    runs-on: ubuntu-latest

    env:
      CI: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Run Selenium tests
        run: mvn -B clean test -Dheadless=true || true

      - name: Upload reports and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-test-artifacts
          path: |
            reports/
            screenshots/
            target/surefire-reports/
          if-no-files-found: ignore
